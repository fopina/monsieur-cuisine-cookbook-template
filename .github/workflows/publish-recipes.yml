name: Publish recipes
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish every Markdown recipe as private
        type: boolean
        required: true
        default: false
permissions:
  contents: write
  pull-requests: write
jobs:
  publish:
    if: inputs.confirm_publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fopina/monsieur-cuisine-cli@github-action-cookbook
        id: cookbook
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Monsieur Cuisine CLI
        run: python -m pip install --disable-pip-version-check monsieur-cuisine-cli
      - name: Prepare temporary session file
        env:
          MC_API_ACCESS_TOKEN: ${{ secrets.MC_API_ACCESS_TOKEN }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get('MC_API_ACCESS_TOKEN')
          if not token:
              raise SystemExit('Repository secret MC_API_ACCESS_TOKEN is not configured.')
          session_path = Path(os.environ['RUNNER_TEMP']) / 'mc-session.json'
          session_path.write_text(json.dumps({'accessToken': token}), encoding='utf-8')
          session_path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'MC_SESSION_FILE={session_path}\n')
          PY
      - name: Refresh and save Monsieur Cuisine token
        id: refresh_token
        env:
          GH_SECRETS_WRITE_TOKEN: ${{ secrets.GH_SECRETS_WRITE_TOKEN }}
          MC_SESSION_FILE: ${{ env.MC_SESSION_FILE }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_SECRETS_WRITE_TOKEN" ]]; then
            echo "GH_SECRETS_WRITE_TOKEN is not configured; skipping token rotation. The current MC_API_ACCESS_TOKEN must still be valid." >&2
            exit 0
          fi
          monsieur-cuisine-cli --session-file "$MC_SESSION_FILE" auth renew
          token="$(python -c 'import json, os; print(json.load(open(os.environ["MC_SESSION_FILE"]))["accessToken"])')"
          printf '%s' "$token" | GH_TOKEN="$GH_SECRETS_WRITE_TOKEN" gh secret set MC_API_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          printf '%s' "$token" | sha256sum | cut -d ' ' -f 1 > "$RUNNER_TEMP/mc-token-hash"
      - name: Find existing recipes
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python - "$RUNNER_TEMP/account-recipes.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from monsieur_cuisine_cli.api.recipes import list_my_recipes

          recipes = []
          page = 1
          while True:
              data = list_my_recipes(
                  page, 100, session_file=os.environ['MC_SESSION_FILE']
              )
              if not isinstance(data, dict):
                  raise SystemExit(f'Recipe list returned an unexpected response for page {page}.')
              recipes.extend(data.get('recipes', []))
              if page >= int(data.get('totalPage', page)):
                  break
              page += 1
          Path(sys.argv[1]).write_text(json.dumps(recipes), encoding='utf-8')
          print(f'Loaded {len(recipes)} existing recipes for title matching.')
          for recipe in recipes:
              print(f'  id={recipe.get("id")} title={recipe.get("title")!r} locale={recipe.get("languageLocale")!r} status={recipe.get("status")!r}')
          PY
      - name: Publish recipes and prepare recipe ID PR
        env:
          RECIPE_JSON_DIR: ${{ steps.cookbook.outputs.output-directory }}
          RUNNER_TEMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=("$RECIPE_JSON_DIR"/*.json)
          if ((${#files[@]} == 0)); then
            echo "No converted recipe JSON files found."
            exit 1
          fi

          failed=0
          changed_markdowns=()
          for recipe in "${files[@]}"; do
            recipe_id_file="${recipe%.json}.id"
            source_file="${recipe%.json}.source"
            thumbnail_file="${recipe%.json}.thumbnail"
            details_image_file="${recipe%.json}.details-image"
            result_file="$RUNNER_TEMP/recipe-result.json"
            error_file="$RUNNER_TEMP/recipe-error.txt"
            command=(monsieur-cuisine-cli --session-file "$MC_SESSION_FILE" recipes)
            resolved_id=""
            if [[ -s "$recipe_id_file" ]]; then
              resolved_id="$(cat "$recipe_id_file")"
            else
              if ! resolved_id="$(python - "$RUNNER_TEMP/account-recipes.json" "$recipe" 2>"$RUNNER_TEMP/match-error.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          account = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          payload = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          title = payload['title'].strip().casefold()
          locale = payload.get('languageLocale', '').strip().casefold()
          matches = [entry for entry in account if entry.get('title', '').strip().casefold() == title]
          same_locale = [entry for entry in matches if entry.get('languageLocale', '').strip().casefold() == locale]
          if same_locale:
              matches = same_locale
          if len(matches) > 1:
              ids = ', '.join(str(entry.get('id')) for entry in matches)
              raise SystemExit(f'Multiple recipes match title {payload["title"]!r} (IDs: {ids}); set recipeId explicitly.')
          if matches:
              print(matches[0]['id'])
          PY
              )"; then
                match_error="$(cat "$RUNNER_TEMP/match-error.txt")"
                echo "Unable to match ${recipe##*/}: $match_error" >&2
                echo "- Unable to match ${recipe##*/}: $match_error" >> "$GITHUB_STEP_SUMMARY"
                failed=1
                continue
              fi
            fi

            if [[ -n "$resolved_id" ]]; then
              echo "Updating private recipe $resolved_id from ${recipe##*/}"
              command+=(update "$resolved_id")
            else
              echo "Creating private recipe from ${recipe##*/}"
              command+=(create)
            fi
            if [[ -s "$thumbnail_file" ]]; then
              command+=(--thumbnail "$(cat "$thumbnail_file")")
            fi
            if [[ -s "$details_image_file" ]]; then
              command+=(--details-image "$(cat "$details_image_file")")
            fi

            private_command=("${command[@]}" --data "$(cat "$recipe")" --json)
            saved_id="$resolved_id"
            if "${private_command[@]}" >"$result_file" 2>"$error_file"; then
              cat "$result_file"
              if [[ -z "$saved_id" ]]; then
                saved_id="$(python - "$result_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding='utf-8')
          decoder = json.JSONDecoder()
          start = raw.find('{')
          if start < 0:
              raise SystemExit('CLI response did not contain a JSON object.')
          result, _ = decoder.raw_decode(raw[start:])
          if isinstance(result, dict) and isinstance(result.get('recipe'), dict):
              result = result['recipe']
          if isinstance(result, dict):
              print(result.get('id') or result.get('recipeId') or '')
          PY
                )"
              fi
            else
              private_error="$(tr '\n' ' ' <"$error_file" | sed 's/[[:space:]]\+/ /g; s/[[:space:]]*$//')"
              draft_file="$RUNNER_TEMP/recipe-draft.json"
              python - "$recipe" "$draft_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          payload['status'] = 'draft'
          Path(sys.argv[2]).write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          PY
            draft_command=("${command[@]}" --data "$(cat "$draft_file")" --json)
            if "${draft_command[@]}" >"$result_file" 2>"$error_file"; then
              cat "$result_file"
              if [[ -z "$saved_id" ]]; then
                saved_id="$(python - "$result_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding='utf-8')
          decoder = json.JSONDecoder()
          start = raw.find('{')
          if start < 0:
              raise SystemExit('CLI response did not contain a JSON object.')
          result, _ = decoder.raw_decode(raw[start:])
          if isinstance(result, dict) and isinstance(result.get('recipe'), dict):
              result = result['recipe']
          if isinstance(result, dict):
              print(result.get('id') or result.get('recipeId') or '')
          PY
                )"
              fi
              message="Unable to publish recipe ${recipe##*/}; it remains in draft. Publish error: ${private_error:-unknown error}"
            else
              draft_error="$(tr '\n' ' ' <"$error_file" | sed 's/[[:space:]]\+/ /g; s/[[:space:]]*$//')"
              message="Unable to publish recipe ${recipe##*/}, and draft fallback also failed. Publish error: ${private_error:-unknown error}. Draft error: ${draft_error:-unknown error}"
            fi
            echo "$message" >&2
            echo "- $message" >> "$GITHUB_STEP_SUMMARY"
            failed=1
            fi

            if [[ -z "$saved_id" ]]; then
              echo "Recipe ${recipe##*/} was saved but the API response did not include an ID; no recipe ID PR can be prepared." >&2
              failed=1
              continue
            fi
            source_path="$(cat "$source_file")"
            update_result="$(python - "$source_path" "$saved_id" "$recipe" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          recipe_id = sys.argv[2]
          payload = json.loads(Path(sys.argv[3]).read_text(encoding='utf-8'))
          locale = payload.get('languageLocale', 'pt-PT').replace('_', '-').lower()
          url = f'https://www.monsieur-cuisine.com/{locale}/previsao-da-receita?recipe-id={recipe_id}'
          replacement = f'| recipeId | [{url}]({url}) |'
          lines = source.read_text(encoding='utf-8').splitlines()
          recipe_heading = next((i for i, line in enumerate(lines) if re.match(r'^##\s+Recipe\s*$', line, re.I)), None)
          if recipe_heading is None:
              raise SystemExit(f'{source} has no ## Recipe table')
          table_end = next((i for i in range(recipe_heading + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
          id_row = next((i for i in range(recipe_heading + 1, table_end) if re.match(r'^\s*\|\s*recipeId\s*\|', lines[i], re.I)), None)
          if id_row is not None:
              if lines[id_row] == replacement:
                  print('unchanged')
              else:
                  lines[id_row] = replacement
                  source.write_text('\n'.join(lines) + '\n', encoding='utf-8')
                  print('changed')
          else:
              separator = next((i for i in range(recipe_heading + 1, table_end) if re.match(r'^\s*\|\s*:?-{3,}', lines[i])), None)
              if separator is None:
                  raise SystemExit(f'{source} has no Markdown table separator under ## Recipe')
              lines.insert(separator + 1, replacement)
              source.write_text('\n'.join(lines) + '\n', encoding='utf-8')
              print('changed')
          PY
            )"
            if [[ "$update_result" == changed ]]; then
              changed_markdowns+=("$source_path")
            fi
          done

          if ((${#changed_markdowns[@]})); then
            branch="recipe-ids/${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git add -- "${changed_markdowns[@]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record Monsieur Cuisine recipe IDs"
            git push origin "$branch"
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Record recipe IDs after publishing" \
              --body "Adds Monsieur Cuisine recipe links to the recipe metadata tables. Recipes without an ID are matched by exact title (and locale when available) before this run creates anything."
          fi
          exit "$failed"
      - name: Save token if the CLI refreshed it during publishing
        if: always() && steps.refresh_token.outcome == 'success'
        env:
          GH_SECRETS_WRITE_TOKEN: ${{ secrets.GH_SECRETS_WRITE_TOKEN }}
          MC_SESSION_FILE: ${{ env.MC_SESSION_FILE }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_SECRETS_WRITE_TOKEN" ]]; then
            echo "GH_SECRETS_WRITE_TOKEN is not configured; skipping token persistence." >&2
            exit 0
          fi
          token="$(python -c 'import json, os; print(json.load(open(os.environ["MC_SESSION_FILE"]))["accessToken"])')"
          current_hash="$(printf '%s' "$token" | sha256sum | cut -d ' ' -f 1)"
          if [[ "$current_hash" != "$(cat "$RUNNER_TEMP/mc-token-hash")" ]]; then
            printf '%s' "$token" | GH_TOKEN="$GH_SECRETS_WRITE_TOKEN" gh secret set MC_API_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          fi
