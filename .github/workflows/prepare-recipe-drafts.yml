name: Prepare recipe drafts
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: recipe-drafts-${{ github.event.pull_request.number }}
jobs:
  draft-recipes:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: changed
        name: Find changed recipe Markdown files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- ':(glob)recipes/**/*.md' | python -c 'import json,sys; print(json.dumps([p for p in sys.stdin.buffer.read().decode().split("\0") if p.lower().endswith(".md")]))')"
          echo "recipe_files=$files" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.changed.outputs.recipe_files != '[]' }}
        uses: fopina/monsieur-cuisine-cli@main
        with:
          operation: draft
          recipe_files: ${{ steps.changed.outputs.recipe_files }}
          session_token: ${{ secrets.MC_API_ACCESS_TOKEN }}
          secrets_write_token: ${{ secrets.GH_SECRETS_WRITE_TOKEN }}
