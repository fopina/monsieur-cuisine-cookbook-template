name: Validate cookbook
on:
  pull_request:
  push:
    branches: [main]
jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fopina/monsieur-cuisine-cli@main
        id: cookbook
        with:
          operation: validate
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-json
          path: ${{ steps.cookbook.outputs.output-directory }}
