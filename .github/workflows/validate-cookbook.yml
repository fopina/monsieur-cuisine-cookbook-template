name: Validate cookbook
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC; run weekly on Mondays at 06:00.
    - cron: '0 6 * * 1'
jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fopina/monsieur-cuisine-cli@main
        id: cookbook
        with:
          operation: validate
      - uses: actions/upload-artifact@v7
        with:
          name: recipe-json
          path: ${{ steps.cookbook.outputs.output-directory }}
